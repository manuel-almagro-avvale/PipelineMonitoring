# Copiar a vars.yml (ignorado por git) y rellenar. Nunca subir vars.yml al repositorio.
# Las service keys se pegan tal cual como bloque de texto (|), sin modificar el JSON.

client_slug: clientname-sandbox

cpi_api_service_key: |
  {
    "oauth": {
      "clientid": "sb-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx!b12345|it!b5678",
      "clientsecret": "REEMPLAZAR",
      "url": "https://<subdominio>.it-cpi018.cfapps.eu10-003.hana.ondemand.com",
      "tokenurl": "https://<subdominio>.authentication.eu10.hana.ondemand.com/oauth/token"
    }
  }

alert_service_key: |
  {
    "oauth": {
      "clientid": "sb-yyyyyyyy-yyyy-yyyy-yyyy-yyyyyyyyyyyy!b12345|it-rt-<subdominio>!b5678",
      "clientsecret": "REEMPLAZAR",
      "url": "https://<subdominio>.it-cpi018-rt.cfapps.eu10-003.hana.ondemand.com",
      "tokenurl": "https://<subdominio>.authentication.eu10.hana.ondemand.com/oauth/token"
    }
  }

alert_endpoint_path: /http/pipeline/alert
client_name: ClientName
environment: dev
#Separar las colas por comas, p.e.: ColaUno,ColaDos
monitored_queues: DemoQueue
monitoring_freq_in_minutes: "5"
monitoring_wait_in_seconds: "60"

# Opcionales (descomentar también en manifest.yml):
